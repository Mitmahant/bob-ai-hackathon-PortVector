submission:
  title: "PortPulse AI — Container Congestion Predictor & Port Operations Optimiser"

  problem_statement: >
    Container port operators have no forward-looking tool to identify berth
    bottlenecks before they cascade into costly vessel waiting and demurrage.
    Port planners need a system that optimises berth allocation, scores
    congestion analytically, models operational interventions, and generates
    clear decision-support recommendations — all without depending on live data
    or an external AI service.

  solution_summary: >
    PortPulse AI is a Streamlit dashboard combining an OR-Tools MIP berth
    scheduling optimizer, a transparent analytical congestion engine, a what-if
    scenario engine, and a deterministic rule-based AI Operations Copilot.
    It delivers a complete 72-hour operational picture plus grounded
    recommendations derived exclusively from the calculated engine outputs —
    no values are fabricated and no external API is required.

  key_features:
    - "OR-Tools SCIP MIP optimizer: allocates 15 vessels across 5 berths minimizing priority-weighted demurrage and berth cost"
    - "Transparent analytical congestion scoring per berth: utilization, queue depth, wait pressure, throughput load"
    - "What-if scenario engine: models service-time reduction, arrival surges, priority changes, berth unavailability"
    - "AI Operations Copilot: deterministic rule-based decision support — operational status, bottleneck analysis, priority actions with evidence, bottleneck-shift warnings"
    - "Interactive 72-hour Gantt, baseline-vs-scenario comparison table, impact cards, and full vessel detail"

  tech_stack:
    languages: ["Python 3.10+"]
    frameworks: ["Streamlit", "OR-Tools (SCIP MIP)"]
    ibm_technologies: ["IBM Bob (AI assistant used in development)"]
    databases: []
    other: ["pandas", "numpy", "plotly", "GitHub Actions"]

  what_we_are_most_proud_of: >
    The strict architectural separation between the numerical engines and the AI
    layer: the optimizer, congestion engine, and scenario engine are immutable
    sources of truth. The AI Copilot can only read their outputs — it cannot
    invent, modify, or override a single number. This is validated by a 100-check
    test suite that verifies every AI-stated value traces to an actual engine
    calculation. The bottleneck-shift detection (Berth 3 → Berth 2 after a
    service-time intervention) demonstrates the kind of non-obvious operational
    insight that decision-support AI should surface.

  known_limitations: >
    All data is simulated — no live port data feed is used. Crane scheduling is
    not modelled (data fields exist but are unused). Vessel arrivals are
    deterministic (no stochastic delay model). The AI Operations Copilot is
    deterministic rule-based, not LLM-powered. Tide windows and weather are not
    modelled. The optimizer is designed for a 72-hour horizon, not a rolling
    multi-day plan.

